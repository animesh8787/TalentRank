# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploys the TalentRank API as a free web service. Click the "Deploy to
# Render" button in the README, or run `render blueprint launch` against
# this file, to create it under your own Render account.
#
# Free-tier notes (see README > Live deployment):
#   - 512MB RAM: requirements.txt has no torch. Semantic matching runs through
#     the Hugging Face Inference API when HF_TOKEN is set; without it the app
#     uses the lighter TF-IDF matcher.
#   - Free instances spin down after 15 minutes idle; the first request
#     after that takes ~30-60s to wake up.
#   - The free disk is ephemeral: anything written to SQLite (accounts, jobs,
#     candidates) and every uploaded resume file is lost on each redeploy or
#     restart. Set DATABASE_URL to a hosted Postgres (e.g. Neon, Supabase, both
#     have free tiers) for the data; uploaded files still need a persistent disk.

services:
  - type: web
    name: talentrank-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false # a hosted Postgres URL; the default SQLite file is wiped on every deploy
      - key: EMBEDDINGS_ENABLED
        value: "true"
      - key: HF_TOKEN
        sync: false # Hugging Face read token; enables semantic matching without torch
      - key: CORS_ORIGINS
        sync: false # set to your deployed frontend URL after the first deploy
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false # paste the full contents of your Firebase service-account JSON here
