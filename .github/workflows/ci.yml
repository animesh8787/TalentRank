name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontend:
    name: Frontend build & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      # Slim install: no torch, no sentence-transformers. The suite runs on the
      # TF-IDF path, which is also what a host without HF_TOKEN uses.
      - run: pip install -r requirements-dev.txt
      - name: Tests (scoring, anonymisation, tenancy scoping, CSV escaping, ingestion)
        env:
          EMBEDDINGS_ENABLED: "false"
        run: python -m pytest -q
      - name: Parser regression check on the sample resumes
        env:
          EMBEDDINGS_ENABLED: "false"
        run: python -m app.eval_parsing
