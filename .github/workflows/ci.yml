name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontend:
    name: Frontend build & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  backend:
    name: Backend import check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # Full CPU-only sentence-transformers install is slow and unnecessary
      # just to prove the app boots — EMBEDDINGS_ENABLED=false exercises the
      # TF-IDF fallback path instead, keeping CI fast.
      - name: Verify the app initialises and every route module imports
        env:
          EMBEDDINGS_ENABLED: "false"
        run: |
          python -c "
          from app.main import app
          routes = [r.path for r in app.routes if hasattr(r, 'methods')]
          assert any('/api/health' in p for p in routes), 'health route missing'
          print(f'{len(routes)} routes registered OK')
          "
