name: Keep Render Backend Alive

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping TalentRank API
        run: |
          # Render free tier spins the service down after 15 min idle. A cold
          # boot installs nothing at request time but still takes a while
          # (Python start, schema sync, and the first embeddings call when
          # HF_TOKEN is set), so allow plenty of time and retry once in case
          # the first attempt lands mid-boot.
          curl --fail --silent --show-error \
            --max-time 120 \
            --retry 1 \
            --retry-delay 10 \
            https://talentrank-api.onrender.com/api/health